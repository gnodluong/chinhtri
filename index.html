<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập 12 bài văn Chính trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-top">
    <h1>Ôn tập 12 bài văn Chính trị</h1>
    <p id="overall" class="overall"></p>
  </div>
  <div class="ticks" id="ticks" role="img" aria-label="Tiến độ: mỗi ô là một câu đã đạt"></div>
</header>

<div class="layout">
  <aside>
    <nav id="list" aria-label="Danh sách 12 câu"></nav>
  </aside>

  <main>
    <div class="tabs" role="tablist">
      <button data-tab="read" class="active">Dàn ý và bài văn</button>
      <button data-tab="quiz">Trắc nghiệm</button>
      <button data-tab="sort">Sắp xếp dàn ý</button>
      <button data-tab="timer">Viết 30 phút</button>
      <button data-tab="progress">Tiến độ</button>
    </div>
    <section id="tab-read"></section>
    <section id="tab-quiz" hidden></section>
    <section id="tab-sort" hidden></section>
    <section id="tab-timer" hidden></section>
    <section id="tab-progress" hidden></section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
